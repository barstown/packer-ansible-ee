---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: CI

# Pull requests only: main only changes through pull requests that passed this.
on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    # The required check; keep the name in sync with the main ruleset.
    name: CI Success
    # Release PRs only touch the changelog and manifest.
    if: >-
      ${{ !(startsWith(github.head_ref, 'release-please--')
      && github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Mise
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          experimental: true
          install_args: --locked

      - name: Sync Python dependencies
        run: uv sync --locked

      # Runs every lint:* task in parallel, as `mise run lint` does locally,
      # and reports all failures rather than stopping at the first.
      - name: Lint
        env:
          # zizmor's online audits query the GitHub API
          GH_TOKEN: ${{ github.token }}
        run: mise run --continue-on-error lint
