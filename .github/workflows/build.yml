---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Build EE image

on:
  pull_request:
    branches:
      - main
  release:
    types:
      - published
  schedule:
    - cron: "0 5 1 * *"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to rebuild (default the latest release)
        required: false
        type: string

concurrency:
  # Rebuilds share one group so they can't race on the floating tags. Each
  # release gets its own group: GitHub keeps only one pending run per group,
  # so a later rebuild could otherwise cancel a queued release.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.release.tag_name || 'publish' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  TEST_TAG: packer-ansible-ee:ci

jobs:
  build:
    name: Build, test and publish
    # Release PRs only touch the changelog and manifest.
    if: >-
      ${{ !(startsWith(github.head_ref, 'release-please--')
      && github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      packer-version: ${{ steps.packer.outputs.PACKER_VERSION }}
    steps:
      - name: Resolve release
        id: release
        if: ${{ github.event_name != 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            # The release that triggered this run is the newest one. Don't ask
            # the API, whose latest release can lag behind the event.
            tag="$RELEASE_TAG"
            is_latest="$([ "$PRERELEASE" = true ] && echo false || echo true)"
          else
            latest="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)" || {
              echo "::error::No release to build yet." >&2
              exit 1
            }
            tag="${INPUT_TAG:-$latest}"
            # Rebuilding an older release must not move the floating tags back.
            is_latest="$([ "$tag" = "$latest" ] && echo true || echo false)"
          fi
          if ! [[ "$tag" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$tag' is not a release tag (MAJOR.MINOR.PATCH)." >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "latest=$is_latest" >> "$GITHUB_OUTPUT"

      # Publishes always build the release tag's source, never main's HEAD.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.release.outputs.tag && format('refs/tags/{0}', steps.release.outputs.tag) || '' }}
          persist-credentials: false

      - name: Source revision
        id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup Mise
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          experimental: true
          install_args: --locked python uv
          # This workflow publishes, so don't restore tool caches.
          cache: false

      - name: Sync Python dependencies
        run: uv sync --locked

      - name: Generate build context
        run: mise run create

      - name: Read pinned Packer version
        id: packer
        run: scripts/packer-build-args.py >> "$GITHUB_OUTPUT"

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          # The published tag is an index (image + attestations); GHCR reads
          # the package description and metadata from index annotations.
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ steps.release.outputs.tag }},enable=${{ steps.release.outputs.tag != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.release.outputs.tag }},enable=${{ steps.release.outputs.latest == 'true' }}
            type=semver,pattern={{major}},value=${{ steps.release.outputs.tag }},enable=${{ steps.release.outputs.latest == 'true' }}
            type=raw,value=latest,enable=${{ steps.release.outputs.latest == 'true' }}
            type=ref,event=pr
          # Override the Rocky base image's labels with this project's.
          labels: &oci-metadata |
            org.opencontainers.image.title=packer-ansible-ee
            org.opencontainers.image.description=Ansible execution environment with Packer for building RHEL (8, 9, 10) and Debian templates
            org.opencontainers.image.version=${{ steps.release.outputs.tag }}
            org.opencontainers.image.revision=${{ steps.revision.outputs.sha }}
            org.opencontainers.image.vendor=${{ github.repository_owner }}
            org.opencontainers.image.authors=${{ github.repository_owner }}
            io.packer.version=${{ steps.packer.outputs.PACKER_VERSION }}
          annotations: *oci-metadata

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Publishing builds skip the layer cache: the Containerfile is unchanged
      # between monthly rebuilds, so a cached `microdnf upgrade` layer would
      # carry no new errata.
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: context
          file: context/Containerfile
          build-args: |
            PACKER_VERSION=${{ steps.packer.outputs.PACKER_VERSION }}
            PACKER_SHA256=${{ steps.packer.outputs.PACKER_SHA256 }}
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ env.TEST_TAG }}
          load: true
          no-cache: ${{ steps.release.outputs.tag != '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        env:
          CONTAINER_RUNTIME: docker
        run: scripts/smoke-test.sh "$TEST_TAG"

      # A release published during this rebuild runs in its own concurrency
      # group; don't let this run move the floating tags back over it.
      - name: Check no newer release
        if: ${{ github.event_name != 'release' && steps.release.outputs.latest == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          latest="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
          if [ "$latest" != "$TAG" ]; then
            echo "::error::$latest was released during this rebuild of $TAG; its own run publishes it." >&2
            exit 1
          fi

      - name: Log in to GHCR
        if: ${{ steps.release.outputs.tag != '' }}
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Rebuilds from the cache populated above, so this only adds the
      # provenance and SBOM attestations and pushes.
      - name: Publish image
        if: ${{ steps.release.outputs.tag != '' }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: context
          file: context/Containerfile
          build-args: |
            PACKER_VERSION=${{ steps.packer.outputs.PACKER_VERSION }}
            PACKER_SHA256=${{ steps.packer.outputs.PACKER_SHA256 }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          tags: ${{ steps.meta.outputs.tags }}
          push: true
          provenance: mode=max
          sbom: true
          cache-from: type=gha

  release-notes:
    name: Add image details to release notes
    needs: build
    if: ${{ github.event_name == 'release' }}
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - name: Append image details
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
          PACKER_VERSION: ${{ needs.build.outputs.packer-version }}
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository }}
        run: |
          marker="<!-- image-details -->"
          body="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body)"
          # Re-runs must not append twice.
          if grep -qF "$marker" <<< "$body"; then
            exit 0
          fi
          tick='`'
          details="$marker
          ### Image

          - **Packer**: $PACKER_VERSION
          - **Pull**: ${tick}$IMAGE:$TAG${tick}

          Rebuilt monthly under the same tags to pick up OS errata."
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes "$body"$'\n\n'"$details"
