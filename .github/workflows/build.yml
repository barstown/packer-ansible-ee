---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Build EE image

on:
  pull_request:
    branches:
      - main
  release:
    types:
      - published

concurrency:
  # Releases share one group and run in order, so an older release can't
  # finish last and move the floating tags back.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || 'release' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  TEST_TAG: packer-ansible-ee:ci

jobs:
  build:
    name: Build, test and publish
    # Release PRs only touch the changelog and manifest.
    if: >-
      ${{ !(startsWith(github.head_ref, 'release-please--')
      && github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      packer-version: ${{ steps.packer.outputs.PACKER_VERSION }}
    steps:
      # On a release, this checks out the release tag.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Mise
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          experimental: true
          install_args: --locked python uv
          # This workflow publishes, so don't restore tool caches.
          cache: false

      - name: Sync Python dependencies
        run: uv sync --locked

      - name: Generate build context
        run: mise run create

      - name: Read pinned Packer version
        id: packer
        run: scripts/packer-build-args.py >> "$GITHUB_OUTPUT"

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          # The published tag is an index (image + attestations); GHCR reads
          # the package description and metadata from index annotations.
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ github.event.release.tag_name }},enable=${{ github.event_name == 'release' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ github.event.release.tag_name }},enable=${{ github.event_name == 'release' && !github.event.release.prerelease }}
            type=semver,pattern={{major}},value=${{ github.event.release.tag_name }},enable=${{ github.event_name == 'release' && !github.event.release.prerelease }}
            type=raw,value=latest,enable=${{ github.event_name == 'release' && !github.event.release.prerelease }}
            type=ref,event=pr
          # Override the Rocky base image's labels with this project's.
          labels: &oci-metadata |
            org.opencontainers.image.title=packer-ansible-ee
            org.opencontainers.image.description=Ansible execution environment with Packer for building RHEL (8, 9, 10) and Debian templates
            org.opencontainers.image.version=${{ github.event.release.tag_name }}
            org.opencontainers.image.vendor=${{ github.repository_owner }}
            org.opencontainers.image.authors=${{ github.repository_owner }}
            io.packer.version=${{ steps.packer.outputs.PACKER_VERSION }}
          annotations: *oci-metadata

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Release builds skip the layer cache, so `microdnf upgrade` always pulls
      # the current errata instead of reusing a layer from an earlier build.
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: context
          file: context/Containerfile
          build-args: |
            PACKER_VERSION=${{ steps.packer.outputs.PACKER_VERSION }}
            PACKER_SHA256=${{ steps.packer.outputs.PACKER_SHA256 }}
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ env.TEST_TAG }}
          load: true
          no-cache: ${{ github.event_name == 'release' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        env:
          CONTAINER_RUNTIME: docker
        run: scripts/smoke-test.sh "$TEST_TAG"

      - name: Log in to GHCR
        if: ${{ github.event_name == 'release' }}
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Rebuilds from the cache populated above, so this only adds the
      # provenance and SBOM attestations and pushes.
      - name: Publish image
        if: ${{ github.event_name == 'release' }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: context
          file: context/Containerfile
          build-args: |
            PACKER_VERSION=${{ steps.packer.outputs.PACKER_VERSION }}
            PACKER_SHA256=${{ steps.packer.outputs.PACKER_SHA256 }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          tags: ${{ steps.meta.outputs.tags }}
          push: true
          provenance: mode=max
          sbom: true
          cache-from: type=gha

  release-notes:
    name: Add image details to release notes
    needs: build
    if: ${{ github.event_name == 'release' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Append image details
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          PACKER_VERSION: ${{ needs.build.outputs.packer-version }}
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository }}
        run: |
          marker="<!-- image-details -->"
          body="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body)"
          # Re-runs must not append twice.
          if grep -qF "$marker" <<< "$body"; then
            exit 0
          fi
          tick='`'
          details="$marker
          ### Image

          - **Packer**: $PACKER_VERSION
          - **Pull**: ${tick}$IMAGE:$TAG${tick}"
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes "$body"$'\n\n'"$details"
